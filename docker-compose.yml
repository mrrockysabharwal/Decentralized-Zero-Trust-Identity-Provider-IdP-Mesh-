services:
  traefik:
    image: traefik:v3.3.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:443:443"
    volumes:
      - type: bind
        source: ./traefik/traefik.yml
        target: /etc/traefik/traefik.yml
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./traefik/dynamic.yml
        target: /etc/traefik/dynamic.yml
        read_only: true
        bind:
          create_host_path: false

      # Generate both mkcert files before starting.
      - type: bind
        source: ./certs/trustmesh.test.pem
        target: /certs/trustmesh.test.pem
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./certs/trustmesh.test-key.pem
        target: /certs/trustmesh.test-key.pem
        read_only: true
        bind:
          create_host_path: false

    networks:
      proxy:
        ipv4_address: 172.30.255.3

    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trustmesh:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    environment:
      TOKEN_KEY_DIR: /run/secrets/trustmesh-keys
      REDIS_URL: redis://redis:6379/0
      FORWARDED_ALLOW_IPS: "172.30.255.3"
      TRUSTMESH_ENV: production
      TOKEN_REVOCATION_ALLOW_IN_MEMORY: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to explicit browser origin(s)}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID to the relying-party domain}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-TrustMesh}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN to the exact browser origin}
      WEBAUTHN_DB_PATH: /data/webauthn.sqlite3
      ADMIN_JWT_PUBLIC_KEY: ${ADMIN_JWT_PUBLIC_KEY:-}
      ADMIN_DIDS: ${ADMIN_DIDS:-}
      ENABLE_LEDGER_TAMPER_DEMO: ${ENABLE_LEDGER_TAMPER_DEMO:-false}

    volumes:
      - webauthn_data:/data
      - type: bind
        source: ${TOKEN_KEY_HOST_DIR:?Set TOKEN_KEY_HOST_DIR to an existing external signing-key directory}
        target: /run/secrets/trustmesh-keys
        read_only: true

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - proxy
      - backend

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sqlite3, urllib.request
          response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
          if json.load(response).get('status') != 'healthy':
              raise SystemExit(1)
          connection = sqlite3.connect('file:/data/webauthn.sqlite3?mode=rw', uri=True, timeout=5)
          try:
              result = connection.execute('PRAGMA quick_check').fetchone()
              if result is None or result[0] != 'ok':
                  raise SystemExit(1)
          finally:
              connection.close()

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  webauthn_data:

networks:
  proxy:
    name: trustmesh-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.255.0/29

  backend:
    driver: bridge
    internal: true
